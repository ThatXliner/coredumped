[package]
name = "xlyph-tui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Binary only builds on native targets
[[bin]]
name = "xlyph-tui"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
bracket-color = { version = "~0.8", features = ["serde"] }
bracket-geometry = "~0.8"
bracket-pathfinding = "~0.8"
bracket-random = "~0.8"
ariadne = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.25"

# WASM dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Performance",
    "console",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"

[features]
default = ["prelude", "native"]
native = []
web = []
# Load Glyph prelude functions, shadowing selected Rust builtins.
prelude = []
