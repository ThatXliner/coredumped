[package]
name = "xlyph-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
bracket-lib = { version = "~0.8", features = ["serde"] }
ariadne = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[features]
default = ["prelude"]
# Load Glyph prelude functions, shadowing selected Rust builtins.
prelude = []
