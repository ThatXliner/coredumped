[package]
name = "coredumped-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
coredumped-core = { path = "../core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Performance",
    "console",
    "Storage",
] }
serde_json = "1"
js-sys = "0.3"
console_error_panic_hook = "0.1"
