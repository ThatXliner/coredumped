[package]
name = "xlyph-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
bracket-color = { version = "~0.8", features = ["serde"] }
bracket-geometry = "~0.8"
bracket-pathfinding = "~0.8"
bracket-random = "~0.8"
ariadne = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.25"
log = { version = "0.4", features = ["std"] }

[features]
default = ["prelude"]
# Load Glyph prelude functions, shadowing selected Rust builtins.
prelude = []
