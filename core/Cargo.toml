[package]
name = "coredumped-core"
version = "0.1.0"
edition = "2021"

[dependencies]
bracket-color = { version = "~0.8", features = ["serde"] }
bracket-geometry = "~0.8"
bracket-pathfinding = "~0.8"
bracket-random = "~0.8"
ariadne = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }

[features]
default = ["prelude"]
prelude = []
